<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMUNITY DISCUSSION - Practical Linux OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Afacad+Flux:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* GLOBAL RESET & DESIGN THEME */
        :root {
            --bg-deep: #0f172a;
            --slide-surface: #1e293b;
            --blue-bubble: #38bdf8;
            --blue-ocean: #0ea5e9;
            --text-light: #f8fafc;
            --text-dim: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-light);
            font-family: 'Afacad Flux', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* PRESENTATION VIEWPORT CANVAS */
        #viewport-wrapper {
            position: relative;
            width: 1280px;
            height: 720px;
            background-color: var(--slide-surface);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        /* DYNAMIC BUBBLING BACKGROUND AESTHETIC */
        .bubble-generator-space {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 15% 25%, rgba(56, 189, 248, 0.12) 0%, transparent 25%),
                radial-gradient(circle at 80% 20%, rgba(14, 165, 233, 0.1) 0%, transparent 30%),
                radial-gradient(circle at 45% 85%, rgba(3, 105, 161, 0.12) 0%, transparent 35%);
            z-index: 1;
        }

        .ambient-bubble {
            position: absolute;
            background: rgba(56, 189, 248, 0.14);
            border-radius: 50%;
            bottom: -120px;
            animation: riseUp 14s infinite ease-in;
            z-index: 1;
        }

        @keyframes riseUp {
            0% { transform: translateY(0) scale(0.7); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translateY(-880px) scale(1.3); opacity: 0; }
        }

        /* SLIDE ANIMATION STAGE */
        .slide-frame {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 80px 70px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: scale(0.96) translateY(10px);
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
            pointer-events: none;
            z-index: 2;
        }

        .slide-frame.active-view {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: all;
            z-index: 3;
        }

        /* BRANDING HEADER AND FOOTER DEFINITIONS */
        .brand-header-label {
            position: absolute;
            top: 35px; left: 70px;
            font-family: 'Comfortaa', cursive;
            font-weight: 700;
            font-size: 22px;
            color: var(--blue-bubble);
            text-transform: uppercase;
            letter-spacing: 3px;
            z-index: 5;
        }

        .brand-footer-label {
            position: absolute;
            bottom: 35px; left: 70px;
            font-size: 18px;
            color: #576b85;
            letter-spacing: 2px;
            font-weight: 600;
            z-index: 5;
        }

        .slide-pagination-index {
            position: absolute;
            bottom: 35px; right: 70px;
            font-size: 18px;
            color: #576b85;
            font-weight: 600;
            z-index: 5;
        }

        /* CONTENT CARDS & CLICKS */
        h1, .section-heading {
            font-family: 'Comfortaa', cursive;
            color: var(--blue-bubble);
        }

        h1 { font-size: 68px; text-align: center; line-height: 1.25; }
        .section-heading { font-size: 42px; border-bottom: 2px solid rgba(56, 189, 248, 0.2); padding-bottom: 12px; margin-top: 20px; }

        .course-title-sub {
            font-size: 26px;
            color: var(--blue-bubble);
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .interactive-question-box {
            background: rgba(30, 41, 59, 0.75);
            border: 2px solid rgba(56, 189, 248, 0.2);
            border-left: 8px solid var(--blue-bubble);
            padding: 40px;
            border-radius: 12px;
            margin-top: 35px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
            position: relative;
        }

        .interactive-question-box:hover {
            border-color: var(--blue-bubble);
            background: rgba(56, 189, 248, 0.04);
            transform: translateY(-2px);
        }

        .interactive-question-box h3 {
            font-size: 28px;
            color: #94a3b8;
            margin-bottom: 15px;
            font-family: 'Comfortaa', cursive;
        }

        .challenge-prompt-text {
            font-size: 42px;
            line-height: 1.4;
            color: var(--text-light);
            font-weight: 600;
        }

        /* REVEAL STATES */
        .instruction-reveal-zone {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            animation: dropDownFade 0.4s ease forwards;
        }

        @keyframes dropDownFade {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .terminal-syntax {
            color: #f1f5f9;
            font-weight: 700;
            background: #090d16;
            padding: 10px 24px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            border: 1px solid rgba(56, 189, 248, 0.4);
            display: inline-block;
            margin-top: 5px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
            font-size: 38px;
            letter-spacing: 1px;
        }

        /* OUTRO DECK TILES FROM INTERFACE SPEC */
        .summary-grid {
            display: flex;
            gap: 25px;
            width: 100%;
            margin-top: 40px;
        }

        .summary-tile-item {
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            padding: 30px;
            flex: 1;
            text-align: center;
            font-size: 32px;
            font-family: 'Comfortaa', cursive;
            color: var(--blue-bubble);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        /* BUTTON BAR NAVIGATION CONTROLS */
        .presentation-navigation-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 20;
        }

        .nav-control-btn {
            background: transparent;
            border: 2px solid rgba(56, 189, 248, 0.5);
            color: var(--blue-bubble);
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Comfortaa', cursive;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .nav-control-btn:hover {
            background: var(--blue-bubble);
            color: var(--bg-deep);
            border-color: var(--blue-bubble);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <div id="viewport-wrapper">
        <div class="bubble-generator-space"></div>
        <div id="dynamic-bubble-box"></div>
        
        <div class="brand-header-label">COMMUNITY DISCUSSION</div>
        <div id="slides-delivery-stage"></div>
        <div class="brand-footer-label">FRMAJISU</div>
        <div class="slide-pagination-index" id="pagination-tracker">1 / 77</div>

        <div class="presentation-navigation-bar">
            <button class="nav-control-btn" onclick="travelToPreviousSlide()">&#8592; PREV</button>
            <button class="nav-control-btn" onclick="travelToNextSlide()">NEXT &#8594;</button>
        </div>
    </div>

    <script>
        // EXECUTIVE OFFICIAL LINUX INSTRUCTIONS COLLECTION
        const syllabusStructure = [
            {
                chapterName: "Chapter 1: The Big Picture",
                items: [
                    { q: "Display the running kernel version and hardware architecture.", r: "<span class='terminal-syntax'>uname -a</span>" },
                    { q: "Print the current working directory path.", r: "<span class='terminal-syntax'>pwd</span>" },
                    { q: "Show the hardware architecture blueprint of the system cpu.", r: "<span class='terminal-syntax'>arch</span>" },
                    { q: "Clear all data from the active terminal window screen.", r: "<span class='terminal-syntax'>clear</span>" },
                    { q: "Display the current system date, time, and timezone parameters.", r: "<span class='terminal-syntax'>date</span>" },
                    { q: "Show the calendar map grid for the current active month.", r: "<span class='terminal-syntax'>cal</span>" },
                    { q: "Print the username string of the current active session account.", r: "<span class='terminal-syntax'>whoami</span>" },
                    { q: "Open the manual documentation reference page for the file listing tool.", r: "<span class='terminal-syntax'>man ls</span>" },
                    { q: "Print the text string 'Hello Class' directly to the terminal output console.", r: "<span class='terminal-syntax'>echo \"Hello Class\"</span>" },
                    { q: "List all previous interactive commands executed in this terminal session.", r: "<span class='terminal-syntax'>history</span>" }
                ]
            },
            {
                chapterName: "Chapter 2: Commands & Hierarchy",
                items: [
                    { q: "Navigate to your home directory, create a folder named IT1201, and list all hidden files inside your current location.", r: "<span class='terminal-syntax'>cd ~ && mkdir IT1201 && ls -a</span>" },
                    { q: "List files in the current folder along with detailed security permissions and sizing metrics.", r: "<span class='terminal-syntax'>ls -l</span>" },
                    { q: "Create a blank file named practice.txt inside the current path.", r: "<span class='terminal-syntax'>touch practice.txt</span>" },
                    { q: "Change your working location directly into the IT1201 folder.", r: "<span class='terminal-syntax'>cd IT1201</span>" },
                    { q: "Copy the content of practice.txt into a separate document named backup.txt.", r: "<span class='terminal-syntax'>cp practice.txt backup.txt</span>" },
                    { q: "Rename the document backup.txt to alternate.txt within the working index.", r: "<span class='terminal-syntax'>mv backup.txt alternate.txt</span>" },
                    { q: "Remove the file alternate.txt permanently from storage allocation tables.", r: "<span class='terminal-syntax'>rm alternate.txt</span>" },
                    { q: "Move your shell position backward exactly one tier up into the parent folder configuration.", r: "<span class='terminal-syntax'>cd ..</span>" },
                    { q: "Delete the empty folder workspace catalog target named IT1201.", r: "<span class='terminal-syntax'>rmdir IT1201</span>" },
                    { q: "Search your working root folder to locate every file entry matching the text extension pattern.", r: "<span class='terminal-syntax'>find . -name \"*.txt\"</span>" }
                ]
            },
            {
                chapterName: "Chapter 3: Devices",
                items: [
                    { q: "Use the lsblk command to identify all block devices and their mount points currently attached to your system.", r: "<span class='terminal-syntax'>lsblk</span>" },
                    { q: "List all hardware controllers dynamically linked over the usb system buses.", r: "<span class='terminal-syntax'>lsusb</span>" },
                    { q: "Display every pci express slot link interface entry connected to the system motherboard board.", r: "<span class='terminal-syntax'>lspci</span>" },
                    { q: "Print complete technical capabilities data and cores configuration of the physical CPU.", r: "<span class='terminal-syntax'>lscpu</span>" },
                    { q: "Generate a summary record detailing all active physical hardware items component blocks on the platform.", r: "<span class='terminal-syntax'>lshw -short</span>" },
                    { q: "Output system volatile random access memory allocation metrics explicitly formatted in megabytes.", r: "<span class='terminal-syntax'>free -m</span>" },
                    { q: "Read the top entries inside the log stream detailing early boot step execution tasks.", r: "<span class='terminal-syntax'>dmesg | head</span>" },
                    { q: "List all low level expansion drivers and modular features injected into the running kernel core layer.", r: "<span class='terminal-syntax'>lsmod</span>" },
                    { q: "Stream the specific system configuration file detailing raw hardware parameters per execution core.", r: "<span class='terminal-syntax'>cat /proc/cpuinfo</span>" },
                    { q: "Output the absolute uptime metric recording how long the operating system kernel has run continuously.", r: "<span class='terminal-syntax'>uptime</span>" }
                ]
            },
            {
                chapterName: "LINUX USERS, GROUPS, OTHERS AND PERMISSIONS",
                items: [
                    { q: "Create a new user account named student1.", r: "<span class='terminal-syntax'>sudo useradd student1</span>" },
                    { q: "Add a new user named student2 with a custom home directory automatically created.", r: "<span class='terminal-syntax'>sudo useradd -m student2</span>" },
                    { q: "Set or update the password string for user student1.", r: "<span class='terminal-syntax'>sudo passwd student1</span>" },
                    { q: "Delete the user account student1 without removing their home directory.", r: "<span class='terminal-syntax'>sudo userdel student1</span>" },
                    { q: "Delete the user account student2 along with their home directory and mail spool.", r: "<span class='terminal-syntax'>sudo userdel -r student2</span>" },
                    { q: "Create a new system group named developers.", r: "<span class='terminal-syntax'>sudo groupadd developers</span>" },
                    { q: "Add the current active user to the developers group.", r: "<span class='terminal-syntax'>sudo usermod -aG developers $USER</span>" },
                    { q: "Remove user student2 from the developers group.", r: "<span class='terminal-syntax'>sudo gpasswd -d student2 developers</span>" },
                    { q: "Delete the group named developers from the system files.", r: "<span class='terminal-syntax'>sudo groupdel developers</span>" },
                    { q: "Set read, write, and execute permissions for the owner, and read-only for group and others on file.txt using text style.", r: "<span class='terminal-syntax'>chmod u=rwx,go=r file.txt</span>" },
                    { q: "Remove all access permissions for others on the file.txt using symbolic text style.", r: "<span class='terminal-syntax'>chmod o-rwx file.txt</span>" },
                    { q: "Set absolute permissions to read, write, and execute for everyone on direct.txt using octal style.", r: "<span class='terminal-syntax'>chmod 777 direct.txt</span>" },
                    { q: "Configure read and write permissions for the owner and group, but no access for others using octal notation on file.txt.", r: "<span class='terminal-syntax'>chmod 660 file.txt</span>" },
                    { q: "Change the owner of directory1 to user student2.", r: "<span class='terminal-syntax'>sudo chown student2 directory1</span>" },
                    { q: "Change both the owner to student2 and group to developers for directory1.", r: "<span class='terminal-syntax'>sudo chown student2:developers directory1</span>" }
                ]
            },
            {
                chapterName: "Chapter 5: Kernel Booting",
                items: [
                    { q: "View the kernel's boot-up logs and search for any messages related to 'SATA' or 'SCSI' using the dmesg command.", r: "<span class='terminal-syntax'>dmesg | grep -E -i \"sata|scsi\"</span>" },
                    { q: "Query system tracking logs to view diagnostic metrics isolated specifically to events on the current runtime instance boot cycle.", r: "<span class='terminal-syntax'>journalctl -b</span>" },
                    { q: "Calculate execution speed summaries tracking the absolute initialization overhead of core systems at platform load.", r: "<span class='terminal-syntax'>systemd-analyze</span>" },
                    { q: "List every system startup worker sorted explicitly by how long each component delayed initialization stages.", r: "<span class='terminal-syntax'>systemd-analyze blame</span>" },
                    { q: "Stream the specific command configuration string arguments injected into the core kernel at the boot step sequence.", r: "<span class='terminal-syntax'>cat /proc/cmdline</span>" },
                    { q: "Check the active system initialization target mode tier step value configuration.", r: "<span class='terminal-syntax'>runlevel</span>" },
                    { q: "Identify the default startup environment profile target configuration layer active at system load.", r: "<span class='terminal-syntax'>systemctl get-default</span>" },
                    { q: "Extract the precise timing timestamp of the last hardware system boot execution sequence.", r: "<span class='terminal-syntax'>who -b</span>" },
                    { q: "Force immediate termination of operational spaces and recycle the physical motherboard loop.", r: "<span class='terminal-syntax'>sudo reboot</span>" },
                    { q: "Parse your central grub configuration interface array mapping to view every system selection item.", r: "<span class='terminal-syntax'>cat /boot/grub/grub.cfg | grep menuentry</span>" }
                ]
            },
            {
                chapterName: "Chapter 6: User Space Starts",
                items: [
                    { q: "List all currently active systemd units on your machine to see which background services are running.", r: "<span class='terminal-syntax'>systemctl list-units --state=active</span>" },
                    { q: "Generate a universal comprehensive list logging every execution thread active on the environment processing table.", r: "<span class='terminal-syntax'>ps aux</span>" },
                    { q: "Launch an interactive terminal metrics console tracing dynamic core utilization shifts in real time.", r: "<span class='terminal-syntax'>top</span>" },
                    { q: "Show the tracking index record array of background jobs running under the current terminal shell instance scope.", r: "<span class='terminal-syntax'>jobs</span>" },
                    { q: "Query the configuration settings verifying the active process status state of the background scheduling agent daemon.", r: "<span class='terminal-syntax'>systemctl status cron</span>" },
                    { q: "Print all security grouping configurations and access privileges assigned to your current execution role profile.", r: "<span class='terminal-syntax'>groups</span>" },
                    { q: "Modify permissions flags on a document file target to permit reading execution and editing access rules to the owner.", r: "<span class='terminal-syntax'>chmod 755 practice.txt</span>" },
                    { q: "Reassign the master security user owner token property over an item record using environmental identity parameters.", r: "<span class='terminal-syntax'>chown $USER practice.txt</span>" },
                    { q: "Display the exact numerical user id tag and primary group identifier numbers verified by internal authorization engines.", r: "<span class='terminal-syntax'>id</span>" },
                    { q: "Review history logs tracking every historic authentication login event registered on this platform server framework.", r: "<span class='terminal-syntax'>last</span>" }
                ]
            },
            {
                chapterName: "Chapter 7: Disks & Filesystems",
                items: [
                    { q: "Check the available free space and usage percentage of your root filesystem using the df -h command.", r: "<span class='terminal-syntax'>df -h</span>" },
                    { q: "Calculate the exact physical space configuration metrics consumed by each directory item inside the folder path.", r: "<span class='terminal-syntax'>du -sh *</span>" },
                    { q: "Enumerate all mounted data partitions alongside their corresponding access read write states.", r: "<span class='terminal-syntax'>mount</span>" },
                    { q: "Create an uncompressed tarball archive backup package containing the specified document path.", r: "<span class='terminal-syntax'>tar -cvf archive.tar practice.txt</span>" },
                    { q: "Compress the tar archive target utilizing structural stream reduction routines.", r: "<span class='terminal-syntax'>gzip archive.tar</span>" },
                    { q: "Inspect file internal metadata properties to classify the true format of data blocks without referencing extensions.", r: "<span class='terminal-syntax'>file practice.txt</span>" },
                    { q: "Read the full contents of the permanent static filesystem filesystem allocation reference document table.", r: "<span class='terminal-syntax'>cat /etc/fstab</span>" },
                    { q: "Output full inode information metrics, dimension limits, and timing records of the designated file target.", r: "<span class='terminal-syntax'>stat practice.txt</span>" },
                    { q: "List directory files explicitly displaying the low-level unique numerical inode pointers alongside file labels.", r: "<span class='terminal-syntax'>ls -i</span>" },
                    { q: "View the first 5 account configurations stored inside the core user authorization parameters file.", r: "<span class='terminal-syntax'>head -n 5 /etc/passwd</span>" }
                ]
            }
        ];

        // RENDER PIPELINE INFRASTRUCTURE
        const deliveryStage = document.getElementById('slides-delivery-stage');
        const indexTracker = document.getElementById('pagination-tracker');
        let trackCurrentIndex = 0;

        // SLIDE 01: TITLE INTERFACE
        let structuralMarkupDeck = `
            <div class="slide-frame active-view" id="presentation-slide-0">
                <div style="display: flex; flex-direction: column; flex-grow: 1; justify-content: center; align-items: center; text-align: center; z-index:3;">
                    <p class="course-title-sub">IT 1201 OPEN SOURCE SYSTEM ANALYSIS & DESIGN</p>
                    <h1>Practical Linux OS<br>Workshop</h1>
                    <p style="margin-top: 40px; font-size: 32px; color: var(--text-dim);">Prepared by <span style="color:var(--blue-bubble); font-weight:700;">FRANCIS MAJISU</span></p>
                </div>
            </div>
        `;

        // GENERATING 65 CHALLENGE SLIDES (10 + 10 + 10 + 15 + 10 + 10 + 10 = 75 questions)
        let iterativeIndex = 1;
        syllabusStructure.forEach((block) => {
            block.items.forEach((element, localOffset) => {
                structuralMarkupDeck += `
                    <div class="slide-frame" id="presentation-slide-${iterativeIndex}">
                        <div style="display: flex; flex-direction: column; flex-grow: 1; justify-content: center; z-index:3;">
                            <h2 class="section-heading">${block.chapterName}</h2>
                            <div class="interactive-question-box" onclick="revealInstructionBlock(this)">
                                <h3>Practical Exercise ${localOffset + 1} of ${block.items.length}</h3>
                                <p class="challenge-prompt-text">${element.q}</p>
                                <div class="instruction-reveal-zone">
                                    <div style="margin-bottom:10px; font-size:22px; color:var(--blue-bubble); font-family:'Comfortaa', cursive; font-weight:700; text-transform:uppercase; letter-spacing:1px;">Execute Command:</div>
                                    <p class="instruction-action-text">${element.r}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                iterativeIndex++;
            });
        });

        // SLIDE 77: OUTRO INTERFACE (Matching user specification document design elements exactly)
        structuralMarkupDeck += `
            <div class="slide-frame" id="presentation-slide-${iterativeIndex}">
                <div style="display: flex; flex-direction: column; flex-grow: 1; justify-content: center; align-items: center; text-align: center; z-index:3;">
                    <h1 style="font-size: 64px; color: var(--blue-bubble); margin-bottom: 10px;">Any Questions?</h1>
                    <p style="font-size: 42px; font-family: monospace; color: #64748b; margin-bottom: 30px;">>_</p>
                    <div class="summary-grid">
                        <div class="summary-tile-item">Practical Linux</div>
                        <div class="summary-tile-item">Open Source</div>
                        <div class="summary-tile-item">Community</div>
                    </div>
                    <p style="margin-top: 50px; font-size: 26px; color: var(--text-dim); font-weight: 600;">
                        Course: IT 1201 | Lead: FRANCIS MAJISU
                    </p>
                </div>
            </div>
        `;

        deliveryStage.innerHTML = structuralMarkupDeck;

        // CALCULATE MAXIMUM CAPACITY
        const absoluteSlideCap = document.querySelectorAll('.slide-frame').length;

        // DYNAMIC HIDDEN COMMAND TOGGLE FUNCTIONALITY
        function revealInstructionBlock(targetBox) {
            const displayZone = targetBox.querySelector('.instruction-reveal-zone');
            
            if (displayZone.style.display === "block") {
                displayZone.style.display = "none";
                targetBox.style.background = "rgba(30, 41, 59, 0.75)";
            } else {
                displayZone.style.display = "block";
                targetBox.style.background = "rgba(56, 189, 248, 0.03)";
            }
        }

        // VIEWPORT ANIMATION AND STATE SYNCHRONIZATION
        function synchronizepresentationState() {
            document.querySelectorAll('.slide-frame').forEach((slide, index) => {
                slide.classList.remove('active-view');
                if (index === trackCurrentIndex) {
                    slide.classList.add('active-view');
                    
                    // Reset visibility states of internal components whenever changing slides
                    const targetHiddenZone = slide.querySelector('.instruction-reveal-zone');
                    const targetBoxElement = slide.querySelector('.interactive-question-box');
                    if (targetHiddenZone && targetBoxElement) {
                        targetHiddenZone.style.display = "none";
                        targetBoxElement.style.background = "rgba(30, 41, 59, 0.75)";
                    }
                }
            });
            indexTracker.innerText = `${trackCurrentIndex + 1} / ${absoluteSlideCap}`;
        }

        function travelToNextSlide() {
            if (trackCurrentIndex < absoluteSlideCap - 1) {
                trackCurrentIndex++;
                synchronizepresentationState();
            }
        }

        function travelToPreviousSlide() {
            if (trackCurrentIndex > 0) {
                trackCurrentIndex--;
                synchronizepresentationState();
            }
        }

        // PHYSICAL KEYBOARD NAVIGATION ROUTINES
        document.addEventListener('keydown', (inputSignal) => {
            if (inputSignal.key === 'ArrowRight' || inputSignal.key === ' ') {
                inputSignal.preventDefault();
                travelToNextSlide();
            } else if (inputSignal.key === 'ArrowLeft') {
                inputSignal.preventDefault();
                travelToPreviousSlide();
            }
        });

        // GENERATING AMBIENT FLOATING BACKGROUND BUBBLES
        const bubbleBox = document.getElementById('dynamic-bubble-box');
        for (let idx = 0; idx < 16; idx++) {
            let containerBubble = document.createElement('div');
            containerBubble.classList.add('ambient-bubble');
            let dimensionalWeight = Math.random() * 90 + 30; 
            containerBubble.style.width = `${dimensionalWeight}px`;
            containerBubble.style.height = `${dimensionalWeight}px`;
            containerBubble.style.left = `${Math.random() * 100}%`;
            containerBubble.style.animationDuration = `${Math.random() * 8 + 10}s`; 
            containerBubble.style.animationDelay = `${Math.random() * 6}s`;
            bubbleBox.appendChild(containerBubble);
        }
        
        // Initial pagination string update
        indexTracker.innerText = `1 / ${absoluteSlideCap}`;
